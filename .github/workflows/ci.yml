name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test with coverage
        run: |
          mkdir -p coverage
          go test -race -count=1 -timeout=300s -coverprofile=coverage/unit.raw -covermode=atomic ./...
      - name: Filter coverage
        run: |
          if [ -f .coverignore ]; then
            pattern=$(grep -v '^#' .coverignore | grep -v '^$' | paste -sd'|' -)
            grep -v -E "$pattern" coverage/unit.raw > coverage/unit.out
          else
            cp coverage/unit.raw coverage/unit.out
          fi
      - name: Coverage summary
        run: go tool cover -func=coverage/unit.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit.out
          retention-days: 30
