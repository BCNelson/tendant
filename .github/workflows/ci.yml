name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [services/api, db]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ matrix.module }}
          args: ./...

  codegen-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Regenerate sqlc + gqlgen, fail on drift
        working-directory: services/api
        run: |
          sqlc generate
          go run github.com/99designs/gqlgen generate
          if ! git diff --exit-code -- internal/db graph; then
            echo "::error::Generated code is out of date. Run 'just generate' locally and commit."
            exit 1
          fi
      - name: Regenerate config reference, fail on drift
        working-directory: services/api
        run: |
          go run ./cmd/gen-config-docs ../../docs/configuration-reference.md
          if ! git diff --exit-code -- ../../docs/configuration-reference.md; then
            echo "::error::docs/configuration-reference.md is out of date. Run 'just gen-config-docs' and commit."
            exit 1
          fi

  flutter-schema-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert apps/mobile/graphql/schema.graphql matches services/api/graph/schema.graphqls
        run: |
          diff -u services/api/graph/schema.graphqls apps/mobile/graphql/schema.graphql \
            || { echo "::error::Flutter schema mirror is stale; run 'just sync-flutter-schema'"; exit 1; }

  go-test:
    runs-on: ubuntu-latest
    # GitHub-hosted runners ship with Docker; testcontainers + DBOS need it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - name: Test with coverage (per workspace module)
        run: |
          mkdir -p coverage
          # go test ./... from a go.work root won't traverse; run per-module
          # and merge profiles.
          (cd services/api && go test -race -count=1 -timeout=600s \
              -coverprofile=../../coverage/api.out -covermode=atomic ./...)
          (cd db && go test -race -count=1 -timeout=600s \
              -coverprofile=../coverage/db.out -covermode=atomic ./... || true)
          # Merge: mode line + appended bodies (skip duplicate mode lines).
          {
            echo "mode: atomic"
            tail -n +2 coverage/api.out 2>/dev/null || true
            tail -n +2 coverage/db.out 2>/dev/null || true
          } > coverage/unit.raw
      - name: Filter coverage
        run: |
          if [ -f .coverignore ]; then
            pattern=$(grep -v '^#' .coverignore | grep -v '^$' | paste -sd'|' -)
            grep -v -E "$pattern" coverage/unit.raw > coverage/unit.out
          else
            cp coverage/unit.raw coverage/unit.out
          fi
      - name: Coverage summary
        run: go tool cover -func=coverage/unit.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit.out
          retention-days: 30
