# Publishes the two gate-script SDKs to npm + crates.io on a gate-sdk-v* tag,
# atomically from the same workspace state (FR-045). A *-rc.* tag runs in
# dry-run mode (no publish). On SDK PRs, both examples are built/exercised
# (FR-046) so a broken SDK never ships.
name: gate-sdk-release

on:
  push:
    tags:
      - "gate-sdk-v*"
  pull_request:
    paths:
      - "sdks/gate-sdk-as/**"
      - "sdks/gate-sdk-rust/**"
      - ".github/workflows/gate-sdk-release.yml"

jobs:
  build-examples:
    name: Build & exercise SDK examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AssemblyScript example compiles against the SDK.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build AssemblyScript example
        working-directory: sdks/gate-sdk-as
        run: |
          npm ci || npm install
          npm run build:example

      # Rust example compiles to wasm32-unknown-unknown.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build Rust example
        working-directory: sdks/gate-sdk-rust
        run: cargo build --target wasm32-unknown-unknown --release --examples

  publish:
    name: Publish to npm + crates.io
    needs: build-examples
    if: startsWith(github.ref, 'refs/tags/gate-sdk-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Determine release mode
        id: mode
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-rc.* ]]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @tendant/gate-sdk (npm)
        working-directory: sdks/gate-sdk-as
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "${{ steps.mode.outputs.dry_run }}" == "true" ]]; then
            npm publish --dry-run --access public
          else
            npm publish --access public
          fi

      - name: Publish tendant-gate-sdk (crates.io)
        working-directory: sdks/gate-sdk-rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          if [[ "${{ steps.mode.outputs.dry_run }}" == "true" ]]; then
            cargo publish --dry-run --allow-dirty
          else
            cargo publish --allow-dirty
          fi
