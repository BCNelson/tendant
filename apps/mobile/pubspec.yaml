name: tendant
description: Flutter client for tendant.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9

  # Phase 2 client stack (see specs/003-operator-edge-wake/research.md R5).
  # Versions pinned to a known-good solve (see pubspec.lock); the original
  # Phase-2 constraints referenced versions that were never published.
  ferry: ^0.16.1
  ferry_flutter: ^0.9.1
  gql_http_link: ^1.2.0
  gql_websocket_link: ^2.1.0
  gql_link: ^1.1.0
  gql: ^1.0.0
  gql_exec: ^1.1.0
  built_value: ^8.9.0
  flutter_riverpod: ^3.3.1
  drift: ^2.33.0
  go_router: ^17.3.0
  flutter_secure_storage: ^10.3.1
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.0
  connectivity_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  ferry_generator: ^0.12.0
  drift_dev: ^2.33.0

flutter:
  uses-material-design: true
