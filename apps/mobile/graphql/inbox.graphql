query Inbox($first: Int, $after: String) {
  inbox(first: $first, after: $after) {
    __typename
    ... on AgentAssignment {
      id
      stage
      ask
      createdAt
      task {
        id
        title
        state
        currentStage
      }
    }
    ... on ApprovalRequest {
      id
      createdAt
    }
    ... on AgentQuestion {
      id
      createdAt
      question
    }
    ... on PromotionProposal {
      id
      createdAt
      fromLevel
      toLevel
    }
  }
}
