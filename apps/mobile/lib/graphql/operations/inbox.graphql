query InboxFeed($first: Int, $after: String) {
  inboxFeed(first: $first, after: $after) {
    nextCursor
    entries {
      id
      kind
      messageType
      urgency
      createdAt
      readAt
      dismissedAt
      item {
        __typename
        ... on ActionableTask {
          id
          task {
            id
            title
            state
            priority
            dueAt
            currentStage
          }
        }
        ... on AgentAssignment {
          id
          stage
          ask
          task {
            id
            title
            state
            currentStage
          }
        }
        ... on ApprovalRequest {
          id
        }
        ... on AgentQuestion {
          id
          question
        }
        ... on PromotionProposal {
          id
          fromLevel
          toLevel
        }
        ... on FeedbackRequest {
          id
          task {
            id
            title
          }
        }
      }
    }
  }
}
