# Full task detail: header, scheduling, the task-graph relations, stage
# occupancy, agent output (findings), and the complete audit timeline.

# A lightweight reference to a linked task, reused by every relation field.
fragment TaskLink on Task {
  id
  shortId
  title
  state
}

query TaskDetail($id: ID!) {
  task(id: $id) {
    id
    shortId
    title
    description
    state
    currentStage
    autonomy
    priority
    dueAt
    startsAt
    rank
    blocked
    blockedBy { ...TaskLink }
    blocks { ...TaskLink }
    parent { ...TaskLink }
    subtasks { ...TaskLink }
    related { ...TaskLink }
    duplicateOf { ...TaskLink }
    duplicates { ...TaskLink }
    findings
    stageSlots {
      stage
      isHuman
      occupant {
        id
        name
        model
      }
    }
    activity {
      id
      kind
      at
      actor
      inReplyTo
      detail
    }
  }
}
