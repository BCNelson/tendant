# gqlgen configuration for the tendant operator-edge GraphQL surface.
# Schema-first; generated code is committed and drift-checked in CI.

schema:
  - graph/*.graphqls

exec:
  filename: graph/generated.go
  package: graph

model:
  filename: graph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: graph
  package: graph
  filename_template: "{name}.resolvers.go"

# Skip the post-generate `go mod tidy` — it can't resolve our workspace-local
# `db` module from inside services/api (tidy isn't workspace-aware in the same
# way `go build` is). We run tidy manually via `just tidy` when needed.
skip_mod_tidy: true

# Auto-bind nothing — resolvers explicitly map sqlc rows → gqlgen models.
autobind: []

# Scalar bindings. ID stays as the gqlgen default (string).
# Field resolvers (`resolver: true`) keep loads lazy.
models:
  Time:
    model: github.com/99designs/gqlgen/graphql.Time
  JSON:
    model: github.com/99designs/gqlgen/graphql.Map

  # Phase 5 — Bytes scalar (base64 string), hand-written marshaler.
  Bytes:
    model: github.com/bcnelson/tendant/services/api/graph/model.Bytes

  # Phase 0/1 — Task/AgentAssignment use field resolvers for nested loads.
  Task:
    fields:
      openAssignment:
        resolver: true
      workflow:
        resolver: true
      # Phase 6 — stageSlots derives per-stage occupancy from the audit DAG.
      stageSlots:
        resolver: true
      # activity — the task's full audit timeline (lazy; detail page only).
      activity:
        resolver: true
      # Category — resolves findings.structured.category → task_categories row.
      category:
        resolver: true
  # Task categories — parent/children are lazy field resolvers so the tree is
  # walked on demand (never eagerly materialized, which would recurse).
  TaskCategory:
    fields:
      parent:
        resolver: true
      children:
        resolver: true
  AgentAssignment:
    fields:
      task:
        resolver: true
      fromAgent:
        resolver: true

  # Phase 2 — PendingDecision-impl types use field resolvers for nested loads
  # (Task, Tool, Principal). gqlgen generates the impl Is*() methods.
  ApprovalRequest:
    fields:
      task:
        resolver: true
      tool:
        resolver: true
      payload:
        resolver: true
      # Phase 4 — overseerEvaluation joins audit_messages lazily.
      overseerEvaluation:
        resolver: true
      # Phase 5 — gateScriptEvaluation joins the gate_script_evaluated row.
      gateScriptEvaluation:
        resolver: true
  AgentQuestion:
    fields:
      task:
        resolver: true
      asker:
        resolver: true
  PromotionProposal:
    fields:
      task:
        resolver: true
      tool:
        resolver: true
  # Post-completion feedback — task + messages join lazily; draftGuidance is
  # populated eagerly by the mapper from the decision payload (plain model field).
  FeedbackRequest:
    fields:
      task:
        resolver: true
      messages:
        resolver: true

  # Phase 5 — gate-script lazy joins. Tool gains two script-history fields.
  # GateScript.tool is populated eagerly by the mapper (the parent Tool is
  # always in hand), so it is a plain model field, not a field resolver.
  Tool:
    fields:
      activeGateScript:
        resolver: true
      gateScripts:
        resolver: true
