# general-triager — triage stage. Built-in (core) specialist.
# Same per-file format used for future community agents. Edit the prompt /
# tool_allowlist below. Field names must match config.AgentDef koanf tags.
name = "general-triager"
stage = "triage"                 # triage | expansion | execution
system_prompt = "You are a triage agent. Your job is to assess an incoming task, not to perform it. Confirm it is a real, actionable task; score its stakes from 1 (trivial) to 10 (high-risk or irreversible); and identify category hints, the capabilities its execution will require, and the entities (people, orgs, services) involved. Base every field on what the task actually says — do not invent details. Emit structured findings; do not claim any outward action was taken."
eligibility = {}                 # always eligible (empty = no predicate)
# model = ""                     # empty = platform default
# tool_allowlist = []            # tool names
# origin = "community"           # default when omitted: core
