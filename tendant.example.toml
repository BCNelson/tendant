# Tendant — example configuration.
#
# Precedence (highest wins): DB overlay (config_entries) > environment >
# this file > code defaults. Copy to `tendant.toml` (or one of the search
# paths) and uncomment what you need. All values shown are the defaults.
#
# Search paths: ./tendant.toml, $XDG_CONFIG_HOME/tendant/tendant.toml,
# /etc/tendant/tendant.toml. Override with `tendant serve --config <path>`.
#
# Env mapping: nested keys map to TENDANT_<SECTION>__<KEY> (double underscore =
# dot), e.g. TENDANT_OVERSEER__PROVIDER=anthropic. The historical flat names
# (DATABASE_URL, TENDANT_OVERSEER_PROVIDER, ...) also still work.
#
# Secrets (🔒) are best supplied via interpolation rather than inlined here.
# Any value in this file may reference:
#   ${env:NAME}            value of env var NAME (also honors NAME_FILE and the
#                          systemd CREDENTIALS_DIRECTORY drop)
#   ${env:NAME:-default}   NAME, or `default` if unset
#   ${file:/path/to/secret}    contents of a file (sops-nix / agenix / k8s),
#                              relative paths resolve from this file's directory
#   ${file:${env:NAME_FILE}}   nested: the path itself comes from an env var
# Use $$ for a literal $. Interpolation applies only to values from this file
# (env-delivered values pass through untouched). See docs/configuration-reference.md.

[server]
# http_addr = ":8080"

[database]
# url = "postgres://localhost:5432/tendant?sslmode=disable"   # 🔒 prefer env

[log]
# level = "info"        # debug | info | warn | error
# format = "json"

[gate]
# call_budget = 100     # per-task max gated calls before fail-close to human

[agent]
# max_iter = 20         # per-stage max agent loop iterations

[overseer]
# Two ways to choose the overseer's model:
#  (1) connection = "<name>"  — reference a named [[llm_connections]] entry below
#      (the multi-connection path; supports anthropic | openai | gemini | bedrock).
#  (2) the legacy provider/model_id + [overseer.anthropic|openai] blocks.
# When `connection` is set it wins. Inference routing is boot-only either way.
# connection = ""
# provider = "log"      # anthropic | openai | log   (boot-only)
# model_id = "log"
# max_eval_per_task = 50
# log_deny_pattern = ""

# [overseer.anthropic]
# api_key = "${env:TENDANT_OVERSEER_ANTHROPIC_API_KEY}"   # 🔒
# base_url = "https://api.anthropic.com"

# [overseer.openai]
# api_key = "${env:TENDANT_OVERSEER_OPENAI_API_KEY}"      # 🔒
# base_url = "https://api.openai.com"

# Named model endpoints (the internal/llm registry). Define as many as you like,
# including several of the same provider (e.g. two OpenAI-compatible backends).
# Reference one from overseer.connection above. Put secrets in via ${env:...} or
# ${file:...} — never inline a real key.
#
# [[llm_connections]]
# name = "claude"
# provider = "anthropic"                 # openai | anthropic | gemini | bedrock | log
# model = "claude-sonnet-4-6"
# api_key = "${env:TENDANT_OVERSEER_ANTHROPIC_API_KEY}"   # 🔒
#
# [[llm_connections]]
# name = "gpt"
# provider = "openai"
# model = "gpt-4.1-mini"
# api_key = "${file:/run/secrets/openai-key}"             # 🔒 file-based secret
#
# [[llm_connections]]
# name = "local-ollama"                  # any OpenAI-compatible endpoint
# provider = "openai"
# base_url = "http://localhost:11434"
# model = "llama3.1"
#
# [[llm_connections]]
# name = "gemini"
# provider = "gemini"
# model = "gemini-2.0-flash"
# api_key = "${env:GEMINI_API_KEY}"      # 🔒
#
# [[llm_connections]]
# name = "bedrock-claude"                # Anthropic-family models on AWS Bedrock
# provider = "bedrock"
# region = "us-east-1"
# model = "anthropic.claude-3-5-sonnet-20241022-v2:0"
# access_key_id = "${env:AWS_ACCESS_KEY_ID}"          # 🔒
# secret_access_key = "${file:/run/secrets/aws-secret}"  # 🔒
# session_token = "${env:AWS_SESSION_TOKEN:-}"        # 🔒 optional (STS)

[gatescript]
# runner = "wazero"     # wazero | log   (boot-only)
# max_module_bytes = 1048576
# max_timeout_ms = 1000
# max_memory_pages = 256
# calendar_max_window_days = 30
# compile_cache_mb = 256
# asc_max_compile_ms = 5000
# asc_max_memory_pages = 2048
# asc_backend = ""      # "" | subprocess (non-sandboxed Tier-1 compile)
# log_deny_pattern = ""

[calibration]
# maturation = "24h"
# window_n = 50
# ratio = 0.9
# min_sample = 20
# demotion_decrement = 0.25
# sweep_cron = "0 * * * *"
# intake_tighten_k = 0.02

[intake]
# gmail_client_id = ""
# gmail_client_secret = ""   # 🔒 prefer TENDANT_GMAIL_CLIENT_SECRET
# gmail_redirect_url = ""

[credentials]
# key = ""              # 🔒 base64 AES-256 key — prefer TENDANT_CREDENTIALS_KEY

[auth]
# Static device-pairing password (reusable). Presented to the pairDevice
# mutation; each device is then issued its own revocable session token.
# password = ""                              # 🔒 prefer TENDANT_PASSWORD / a file
# password = "${file:/run/secrets/tendant-password}"   # 🔒 read from a file
#   Also works: TENDANT_PASSWORD=..., TENDANT_PASSWORD_FILE=/path, or systemd
#   LoadCredential ($CREDENTIALS_DIRECTORY/TENDANT_PASSWORD).

[seed]
# example_gate_script = false

