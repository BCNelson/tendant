services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tendant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tendant"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
