services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tendant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tendant"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The pairing flow needs a static auth password at boot. The literal here
  # is a reproducible dev value; production deployments MUST rotate it (see
  # README § Auth password).
  api:
    image: ghcr.io/bcnelson/tendant:latest
    profiles: ["full"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/tendant?sslmode=disable
      TENDANT_PASSWORD: "dev-setup-2026-05-28"
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
